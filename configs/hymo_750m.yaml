# HyMo v1.0 primary configuration.
# This YAML is the source of truth; frozen dataclasses validate it at load time.

model:
  # Vocabulary and maximum context window.
  vocab_size: 64256
  max_seq_len: 4096
  tie_embeddings: true

  # Hybrid block schedule and model width.
  n_layers: 32
  dim: 896

  # MLA: sparse full-attention anchors with low-rank KV compression.
  n_heads: 16
  n_kv_groups: 4
  q_lora_rank: 224
  kv_lora_rank: 128
  head_dim: 128
  qk_rope_head_dim: 32
  qk_nope_head_dim: 96
  v_head_dim: 128
  rope_theta: 10000.0

  # GDN: recurrent linear-attention dimensions.
  gdn_d_state: 32
  gdn_d_conv: 4
  gdn_headdim: 32
  gdn_d_inner: 1280

  # Optional NoPE variant for selected GDN layers; disabled in v1.0.
  nope_hybrid_gdn_enabled: false

  # Sparse feed-forward experts used on MLA blocks.
  n_routed_experts: 16
  n_shared_experts: 1
  n_activated_experts: 2
  moe_inter_dim: 2304
  moe_ema_alpha: 0.02
  moe_capacity_factor: 1.5

  # GDN blocks use their dense feed-forward path; no extra knobs here.

  # Auxiliary heads for predicting multiple future tokens.
  mtp_depth: 2
  mtp_loss_weights: [0.3, 0.1]
  mtp_inter_dim: 2304

  # Smoothly bounds output logits when positive.
  logit_softcap: 15.0

  # Initialization follows module-level PyTorch defaults and model-specific gates.

optimizer:
  # NorMuon (attention + GDN matrices, 2D dense)
  muon_lr: 0.02
  muon_momentum: 0.95
  muon_betas: [0.95, 0.95]
  muon_eps: 1.0e-8
  muon_weight_decay: 0.1

  # AdamW (embed/head/norm/gate/scalars + MoE experts)
  adamw_lr: 3.0e-4
  adamw_betas: [0.9, 0.95]
  adamw_eps: 1.0e-8
  adamw_weight_decay: 0.0

  # Optimizers keep FP32 master copies internally.

  # Apply decay only where the gradient is aligned when enabled.
  cautious_wd: true

scheduler:
  total_steps: 57220
  warmup_frac: 0.02
  stable_frac: 0.83
  decay_frac: 0.15
  min_lr_ratio: 0.05
  decay: linear

training:
  # Batch
  micro_batch_size: 4
  gradient_accumulation_steps: 8
  max_seq_len: 4096

  # Distributed
  world_size: 4
  fsdp: true
  fsdp_mixed_precision: bfloat16

  # Gradient handling
  grad_clip: 1.0
  loss_nan_skip: true

  # Checkpoint, logging, and validation cadence in optimizer steps.
  save_interval: 4000
  log_interval: 50
  eval_interval: 2000

  # Explicit opt-ins for sanctioned CUDA and mixed-precision paths.
  fused_gdn: true
  moe_mixed_precision: true
  torch_compile_gdn: true

run:
  name: hymo-v1.0
  output_dir: checkpoints/pretrain
