# HyMo v1.0 data mixture configuration.
# Target total = 30B tokens.
sources:
  - { id: fineweb_edu_q3, weight: 0.50 }
  - { id: fineweb,         weight: 0.14 }
  - { id: stack_python,    weight: 0.10 }
  - { id: stack_java,      weight: 0.03 }
  - { id: stack_cpp,       weight: 0.02 }
  - { id: slimpajama,      weight: 0.08 }
  - { id: dclm_baseline,   weight: 0.05 }
  - { id: dolma_wiki,      weight: 0.04 }
  - { id: dolma_books,     weight: 0.03 }
  - { id: cosmopedia,      weight: 0.01 }

train_fraction: 0.97
val_fraction: 0.015
test_fraction: 0.015

sharding:
  shard_size_tokens: 50000000
  dtype: uint32
  target_total_tokens: 30000000000
  cross_document_boundary_ok: false
  verify_after_pack: true
  output_dir: data/shards

tokenization:
  name: hymo-bpe-64k
  path: data/tokens/byte_bpe_vocab.json
  vocab_size: 64256
  eos_token_id: 0
  pad_token_id: 2
  add_eos: true
  byte_fallback: true
  batch_size: 1024
  add_special_tokens: false

dedup:
  enabled: true
  method: sha256
  n_hash_buckets: 256
  bloom_capacity_per_bucket: 200000
  bloom_error_rate: 0.001

quality:
  drop_empty: true
  min_unique_chars_ratio: 0.05
  max_digit_ratio: 0.5
  max_punct_ratio: 0.5
  max_whitespace_ratio: 0.5

seed: 42
streaming_download: true
