[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "hymo"
version = "0.1.0"
description = "HyMo: a 750M-active hybrid GDN+MLA+MoE language model, pre-trained from scratch on 30B tokens."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Atandra Bharati" },
]
keywords = [
    "language-model",
    "hybrid-architecture",
    "gated-delta-net",
    "multi-head-latent-attention",
    "mixture-of-experts",
    "pytorch",
    "fsdp-2",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime dependencies stay minimal; lower bounds permit compatible upgrades.
dependencies = [
    "torch>=2.5",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "tokenizers>=0.19",
    "datasets>=2.20",
]

[project.optional-dependencies]
# Training-only dependencies, needed for the production distributed run.
train = [
    # "fla>=0.1",                 # fla-org GDN kernel (unavailable in standard registry)
    "triton>=3.0.0; sys_platform == 'linux'", # custom Triton kernel for GDN
    "wandb>=0.17",              # optional: W&B logging
]
# Local development and quality-gate tooling.
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/atandra-bharati/hymo"
Documentation = "https://github.com/atandra-bharati/hymo/tree/main/docs"

# ----------------------------------------------------------------------
# Build configuration for the src/ layout.
# ----------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/hymo"]

# ----------------------------------------------------------------------
# Static analysis and test-runner configuration.
# ----------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Focused rules catch correctness and maintainability issues without style churn.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line-too-long — handled by formatter
    "B008", # function-call-in-default-arg — common in PyTorch
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]  # asserts are fine in tests

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
mypy_path = "src"

[[tool.mypy.overrides]]
# Third-party stubs are incomplete, so strict checking is relaxed only for them.
module = ["torch.*", "datasets.*", "tokenizers.*", "tqdm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require a GPU (deselect on CPU-only machines)",
    "integration: marks integration tests that touch multiple modules",
    "heavy: marks tests that build the production HyMo model (1.86 B params; runs on CI / GPU pod, not on M1 Air)",
]
